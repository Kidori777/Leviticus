<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레위기 — 하나님의 영원한 경륜 시리즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #120A14;        /* 깊은 어둠 — 지성소의 밤 */
    --surface:  #1E1020;        /* 카드 배경 */
    --veil:     #2A1530;        /* 경계 */
    --crimson:  #8B1A2E;        /* 속죄의 붉은빛 */
    --blood:    #B0263E;        /* 포인트 */
    --bronze:   #A8743A;        /* 번제단 동빛 */
    --gold:     #C9984E;        /* 금빛 */
    --linen:    #EDE0D0;        /* 세마포 — 본문 (밝게) */
    --mist:     #B0A0AC;        /* 보조 텍스트 (밝게) */
    --holy:     #F5EFE6;        /* 거룩한 빛 (밝게) */
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background-color: var(--bg);
    color: var(--linen);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── 빛 번짐 배경 ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 45% at 50% 0%,   rgba(176,38,62,.18) 0%, transparent 65%),
      radial-gradient(ellipse 40% 60% at 90% 85%,  rgba(168,116,58,.10) 0%, transparent 60%),
      radial-gradient(ellipse 30% 40% at 10% 70%,  rgba(139,26,46,.08) 0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── 캔버스 파티클 (향연기) ── */
  #incense {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: .35;
  }

  /* ── HERO ── */
  .hero {
    position: relative;
    z-index: 1;
    padding: 88px 24px 56px;
    text-align: center;
    max-width: 840px;
    margin: 0 auto;
  }

  .series-label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Noto Serif KR', serif;
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: .24em;
    color: var(--gold);
    margin-bottom: 36px;
  }
  .series-label::before,
  .series-label::after {
    content: '';
    display: block;
    width: 28px;
    height: 1px;
    background: var(--bronze);
  }

  /* 시그니처: 제목 위아래 번제단 불꽃 모양 장식선 */
  .flame-deco {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 18px;
  }
  .flame-deco span {
    display: block;
    width: 2px;
    border-radius: 1px;
    background: linear-gradient(to top, var(--crimson), var(--gold), transparent);
    animation: flicker 2.4s ease-in-out infinite alternate;
  }
  .flame-deco span:nth-child(1) { height: 22px; animation-delay: 0s;    }
  .flame-deco span:nth-child(2) { height: 34px; animation-delay: .3s;   }
  .flame-deco span:nth-child(3) { height: 44px; animation-delay: .15s;  }
  .flame-deco span:nth-child(4) { height: 38px; animation-delay: .45s;  }
  .flame-deco span:nth-child(5) { height: 26px; animation-delay: .6s;   }
  .flame-deco span:nth-child(6) { height: 18px; animation-delay: .2s;   }
  .flame-deco span:nth-child(7) { height: 30px; animation-delay: .5s;   }

  @keyframes flicker {
    0%   { opacity: .6; transform: scaleY(.9); }
    100% { opacity: 1;  transform: scaleY(1.05); }
  }

  .book-title {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(58px, 11vw, 104px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.02em;
    color: var(--holy);
    text-shadow: 0 0 60px rgba(176,38,62,.5), 0 0 20px rgba(201,152,78,.2);
  }

  .hebrew-sub {
    display: block;
    font-family: 'Noto Serif KR', serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: .18em;
    color: var(--linen);
    margin-top: 16px;
  }

  .book-desc {
    font-size: 14px;
    line-height: 2;
    color: var(--linen);
    margin-top: 22px;
    max-width: 440px;
    margin-left: auto;
    margin-right: auto;
    word-break: keep-all;
  }
  .book-desc em {
    color: var(--gold);
    font-style: normal;
  }

  /* ── 구분선 ── */
  .divider {
    position: relative;
    z-index: 1;
    max-width: 840px;
    margin: 0 auto 44px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--veil), transparent);
  }
  .divider-icon {
    width: 8px; height: 8px;
    border: 1px solid var(--bronze);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* ── 목록 ── */
  .list-wrap {
    position: relative;
    z-index: 1;
    max-width: 840px;
    margin: 0 auto 80px;
    padding: 0 24px;
  }

  .episode-link {
    display: grid;
    grid-template-columns: 52px 1fr 32px;
    align-items: center;
    gap: 18px;
    text-decoration: none;
    padding: 24px 20px 24px 24px;
    margin-bottom: 2px;
    background: transparent;
    border: 1px solid transparent;
    border-bottom-color: var(--veil);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    transition: background .2s, border-color .2s;

    /* 진입 초기 상태 */
    opacity: 0;
    transform: translateX(-12px);
    transition:
      opacity .5s ease,
      transform .5s ease,
      background .2s,
      border-color .2s;
  }

  /* 왼쪽 붉은 글로우 bar */
  .episode-link::before {
    content: '';
    position: absolute;
    left: 0; top: 12%; bottom: 12%;
    width: 2px;
    background: linear-gradient(to bottom, var(--crimson), var(--blood));
    border-radius: 1px;
    opacity: 0;
    box-shadow: 0 0 8px var(--blood);
    transition: opacity .22s;
  }
  .episode-link:hover {
    background: rgba(139,26,46,.12);
    border-color: var(--veil);
    border-bottom-color: var(--crimson);
  }
  .episode-link:hover::before { opacity: 1; }

  .episode-link.visible {
    opacity: 1;
    transform: translateX(0);
  }

  /* 번호 */
  .ep-num {
    font-family: 'Noto Serif KR', serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: .14em;
    color: var(--bronze);
    text-align: right;
    line-height: 1;
    user-select: none;
    padding-top: 2px;
  }

  /* 본문 */
  .ep-body { min-width: 0; }

  .ep-range {
    display: block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .16em;
    color: var(--gold);
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  .ep-title {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(15px, 2.4vw, 18px);
    font-weight: 600;
    color: var(--holy);
    line-height: 1.4;
    word-break: keep-all;
    transition: color .2s;
  }
  .episode-link:hover .ep-title {
    color: var(--gold);
  }

  /* 화살표 */
  .ep-arrow {
    font-size: 15px;
    color: var(--mist);
    transition: transform .22s, color .2s;
    flex-shrink: 0;
    text-align: center;
  }
  .episode-link:hover .ep-arrow {
    transform: translateX(5px);
    color: var(--blood);
  }

  /* ── 하단 카운트 ── */
  .count-bar {
    position: relative;
    z-index: 1;
    max-width: 840px;
    margin: 0 auto 24px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    font-size: 11px;
    color: var(--linen);
    letter-spacing: .1em;
  }
  .count-bar strong { color: var(--gold); }

  /* ── 푸터 ── */
  .footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 28px 24px 48px;
    font-size: 11.5px;
    color: var(--linen);
    letter-spacing: .1em;
    border-top: 1px solid var(--veil);
    max-width: 840px;
    margin: 0 auto;
  }
  .footer em { color: var(--gold); font-style: normal; }

  /* ── 모바일 ── */
  @media (max-width: 560px) {
    .hero { padding: 60px 20px 40px; }
    .episode-link {
      grid-template-columns: 36px 1fr 24px;
      gap: 12px;
      padding: 18px 14px 18px 18px;
    }
  }
</style>
</head>
<body>

<canvas id="incense"></canvas>

<header class="hero">
  <div class="series-label">하나님의 영원한 경륜 시리즈</div>
  <div class="flame-deco">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>
  <h1 class="book-title">레위기</h1>
  <span class="hebrew-sub">LEVITICUS · וַיִּקְרָא · "그가 부르셨다"</span>
  <p class="book-desc">
    제물의 피로 열린 길,<br>
    세마포로 감싼 <em>거룩함</em>의 부르심.<br>
    하나님 앞에 나아가는 자의 경로.
  </p>
</header>

<div class="divider"><span class="divider-icon"></span></div>

<div class="count-bar">총 <strong>5</strong> 편</div>

<main class="list-wrap" id="list">

  <a class="episode-link"
     href="https://kidori777.github.io/Leviticus/레위기 1장-7장 끊어진 길 다시 열리다.html"
     target="_blank">
    <span class="ep-num">01</span>
    <div class="ep-body">
      <span class="ep-range">1–7장</span>
      <span class="ep-title">끊어진 길 다시 열리다</span>
    </div>
    <span class="ep-arrow">→</span>
  </a>

  <a class="episode-link"
     href="https://kidori777.github.io/Leviticus/레위기 8장-10장 거룩한 부르심.html"
     target="_blank">
    <span class="ep-num">02</span>
    <div class="ep-body">
      <span class="ep-range">8–10장</span>
      <span class="ep-title">거룩한 부르심</span>
    </div>
    <span class="ep-arrow">→</span>
  </a>

  <a class="episode-link"
     href="https://kidori777.github.io/Leviticus/레위기 11장-15장 거룩과 정결의 경륜.html"
     target="_blank">
    <span class="ep-num">03</span>
    <div class="ep-body">
      <span class="ep-range">11–15장</span>
      <span class="ep-title">거룩과 정결의 경륜</span>
    </div>
    <span class="ep-arrow">→</span>
  </a>

  <a class="episode-link"
     href="https://kidori777.github.io/Leviticus/레위기 16장 속죄일.html"
     target="_blank">
    <span class="ep-num">04</span>
    <div class="ep-body">
      <span class="ep-range">16장</span>
      <span class="ep-title">속죄일</span>
    </div>
    <span class="ep-arrow">→</span>
  </a>

  <a class="episode-link"
     href="https://kidori777.github.io/Leviticus/레위기 17장-27장 거룩에서 함께 거함으로.html"
     target="_blank">
    <span class="ep-num">05</span>
    <div class="ep-body">
      <span class="ep-range">17–27장</span>
      <span class="ep-title">거룩에서 함께 거함으로</span>
    </div>
    <span class="ep-arrow">→</span>
  </a>

</main>

<footer class="footer">
  <em>부산교회</em> · 하나님의 영원한 경륜 시리즈 · 레위기 전권
</footer>

<script>
/* ── 향연기 파티클 ── */
(function () {
  const canvas = document.getElementById('incense');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function rand(a, b) { return a + Math.random() * (b - a); }

  function Particle() {
    this.reset = function () {
      this.x  = rand(W * .2, W * .8);
      this.y  = H + 10;
      this.vx = rand(-.3, .3);
      this.vy = rand(-1, -.4);
      this.alpha = rand(.04, .12);
      this.r  = rand(6, 18);
      this.life = rand(180, 320);
      this.age  = 0;
    };
    this.reset();
    this.y = rand(0, H);  // 초기 분산
  }

  for (let i = 0; i < 28; i++) particles.push(new Particle());

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x  += p.vx;
      p.y  += p.vy;
      p.vx += rand(-.015, .015);
      p.age++;
      const progress = p.age / p.life;
      const a = p.alpha * Math.sin(Math.PI * progress);
      ctx.beginPath();
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      grad.addColorStop(0, `rgba(201,152,78,${a})`);
      grad.addColorStop(1, `rgba(139,26,46,0)`);
      ctx.fillStyle = grad;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      if (p.age >= p.life) p.reset();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ── 스크롤 진입 애니메이션 ── */
const items = document.querySelectorAll('.episode-link');
const io = new IntersectionObserver(entries => {
  entries.forEach((e, i) => {
    if (e.isIntersecting) {
      setTimeout(() => e.target.classList.add('visible'), i * 70);
      io.unobserve(e.target);
    }
  });
}, { threshold: 0.1 });
items.forEach(el => io.observe(el));
</script>
</body>
</html>
